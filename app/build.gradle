plugins { id 'com.android.application' }

android {
    namespace 'com.example.photoguide'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'com.example.photoguide'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()
        versionName = (project.findProperty('appVersionName') ?: '0.0.1')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
