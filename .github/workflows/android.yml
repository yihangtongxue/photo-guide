name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  queue: max
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve version
        id: version
        run: .github/scripts/release-version.sh
      - name: Build APK
        run: ./gradlew assembleDebug -PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.code }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="photo-guide-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --verify-tag --title "$TAG" --notes "Debug APK for $TAG."
          fi
